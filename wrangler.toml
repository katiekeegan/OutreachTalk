name = "outreach-talk"
main = "src/worker.js"
compatibility_date = "2026-08-05"
workers_dev = true

[vars]
# Keep this empty for clean routes on workers.dev or a dedicated subdomain:
# /, /moderator/, /play/, and /lab/
APP_BASE_PATH = ""

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# Wrangler's automatic resource provisioning creates and attaches a free D1
# database on the first deployment. The Worker initializes its schema itself.
[[d1_databases]]
binding = "DB"
